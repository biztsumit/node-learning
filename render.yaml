# Render "Blueprint": describes the whole deployment, so Render can create it in one go.
# Dashboard → New → Blueprint → pick this GitHub repo. Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ecommerce-api
    runtime: node
    plan: free
    region: singapore                  # closest Render region to India
    # No "branch:" = deploy the GitHub repo's default branch (yours is "dev").
    # Every push to it triggers a new deploy.
    buildCommand: npm ci
    # Migrations run on every deploy before the server starts (they skip what's already applied)
    startCommand: npm run migrate && npm start
    # Render only sends traffic to a new version once this answers 200
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Render's load balancer is 1 proxy in front of the app
      - key: TRUST_PROXY
        value: "1"
      # Filled in automatically from the database below
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      # Render generates a long random secret for you
      - key: JWT_SECRET
        generateValue: true
      # sync: false = Render asks you for these when you create the Blueprint (leave blank to skip)
      - key: CORS_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: ecommerce-db
    plan: free                         # note: Render's free databases expire after 30 days
    region: singapore
    databaseName: ecommerce
    user: ecommerce
