<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password (dev tool)</title>
  <link rel="stylesheet" href="product-image.css">
</head>
<body>
  <main>
    <h1>Choose a new password</h1>
    <p class="hint">Development stand-in for your frontend's "reset password" page. It reads the token from this page's address.</p>
    <form id="form" data-action="reset">
      <input name="newPassword" type="password" placeholder="new password (at least 6 characters)" minlength="6" required>
      <button>Save new password</button>
    </form>
    <ol id="log"></ol>
  </main>
  <script src="link-pages.js"></script>
</body>
</html>
